openapi: 3.0.3
info:
  title: TicketFlow API
  version: 1.0.0
  description: REST API for support tickets (backend). List/search/filter share GET /tickets.
servers:
  - url: http://localhost:8080
    description: Local dev
paths:
  /api/v1/tickets:
    get:
      operationId: listTickets
      summary: List, search, and filter tickets (paginated)
      tags: [Tickets]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          description: "Spring style: field,direction. Allowed fields: createdAt, priority, status, updatedAt"
          schema:
            type: string
            example: createdAt,desc
        - name: q
          in: query
          description: Search ticket id (exact) or substring in title/description
          schema:
            type: string
        - name: status
          in: query
          description: Filter by status; repeat for multiple (OR)
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TicketStatus'
          style: form
          explode: true
      responses:
        '200':
          description: Paginated ticket summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: createTicket
      summary: Create ticket (spec 001)
      tags: [Tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/tickets/{ticketId}:
    get:
      operationId: getTicket
      summary: View ticket detail and comments (spec 003)
      tags: [Tickets]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      operationId: updateTicket
      summary: Partial update (spec 004)
      tags: [Tickets]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/tickets/{ticketId}/comments:
    post:
      operationId: addComment
      summary: Add comment (spec 005)
      tags: [Comments]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  parameters:
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    TicketStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED, CANCELLED]
    TicketPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]
    TicketSummary:
      type: object
      required: [id, title, priority, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        priority:
          $ref: '#/components/schemas/TicketPriority'
        status:
          $ref: '#/components/schemas/TicketStatus'
        assignee:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TicketPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TicketSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        sort:
          type: string
          description: Echo of applied sort
    TicketDetail:
      allOf:
        - $ref: '#/components/schemas/TicketSummary'
        - type: object
          required: [description, comments]
          properties:
            description:
              type: string
            comments:
              type: array
              items:
                $ref: '#/components/schemas/Comment'
    CreateTicketRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        priority:
          $ref: '#/components/schemas/TicketPriority'
        status:
          $ref: '#/components/schemas/TicketStatus'
        assignee:
          type: string
          nullable: true
    UpdateTicketRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
        priority:
          $ref: '#/components/schemas/TicketPriority'
        status:
          $ref: '#/components/schemas/TicketStatus'
        assignee:
          type: string
          nullable: true
    CreateCommentRequest:
      type: object
      required: [body, author]
      properties:
        body:
          type: string
          maxLength: 5000
        author:
          type: string
    Comment:
      type: object
      required: [id, body, author, createdAt]
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        author:
          type: string
        createdAt:
          type: string
          format: date-time
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        rejectedValue:
          nullable: true
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_FAILED
        message:
          type: string
        correlationId:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'